# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build release site
        # Preserve the historical article in docs/: it has no source vignette
        # in this repository and would otherwise be removed by a clean build.
        run: |
          Sys.setenv(PKGDOWN_DEV_MODE = "release")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, clean = FALSE)
        shell: Rscript {0}

      - name: Build development site
        # This creates docs/dev/ and enables pkgdown's "Dev status" sidebar.
        run: |
          Sys.setenv(PKGDOWN_DEV_MODE = "devel")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, clean = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs
